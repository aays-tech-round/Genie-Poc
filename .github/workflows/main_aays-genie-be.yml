# Builds and deploys the FastAPI backend (app/) to the aays-genie-be App Service.
# Runtime settings (Databricks, Entra, Azure SQL) live in the App Service's environment variables.

name: Build and deploy Python app to Azure Web App - aays-genie-be

on:
  push:
    branches:
      - 'main'
    paths:
      - 'app/**'
      - '.github/workflows/main_aays-genie-be.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Catches dependency errors before deploying. App Service installs requirements.txt
      # itself (SCM_DO_BUILD_DURING_DEPLOYMENT=true), so this venv is not deployed.
      - name: Check that dependencies install
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r app/requirements.txt

      # Only the app/ folder is deployed, so main.py and requirements.txt sit at the site root.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            app/
            !app/**/__pycache__/
            !app/.venv/
            !app/.env

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'aays-genie-be'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3F48C3419C90404995E90B9F8FFBF645 }}
