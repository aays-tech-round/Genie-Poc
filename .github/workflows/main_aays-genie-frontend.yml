# Builds the Vite/React frontend (Frontend/) and deploys the static build to the
# aays-genie-frontend App Service. VITE_* values are baked into the bundle at build time,
# so they come from the "varibales" GitHub environment, not from App Service settings.

name: Build and deploy Node.js app to Azure Web App - aays-genie-frontend

on:
  push:
    branches:
      - 'main'
    paths:
      - 'Frontend/**'
      - '.github/workflows/main_aays-genie-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: varibales
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: npm install and build
        working-directory: Frontend
        env:
          VITE_SSO_CLIENT_ID: ${{ secrets.VITE_SSO_CLIENT_ID }}
          VITE_SSO_AUTHORITIES: ${{ secrets.VITE_SSO_AUTHORITIES }}
          VITE_SSO_API_SCOPE: ${{ secrets.VITE_SSO_API_SCOPE }}
          VITE_GENIE_API_BASE_URL: ${{ secrets.VITE_GENIE_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: Frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aays-genie-frontend'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9884385BBA3E42E1B534680575BE912F }}
